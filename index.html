<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe vs MrBeast - Gaming Hub</title>
    <style>
        :root {
            --pepe-green: #00ff66;
            --beast-pink: #ff007f;
            --bg-dark: #0a0b10;
            --card-bg: rgba(20, 22, 37, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1c30 0%, var(--bg-dark) 70%);
            color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Valodas slēdzis */
        .lang-switcher {
            align-self: flex-end;
            margin-bottom: 40px;
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #9ca3af;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--pepe-green), #00cc52);
            color: #000;
            border-color: var(--pepe-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }

        /* Galvene */
        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 4.5rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--pepe-green) 30%, #00bfff 60%, var(--beast-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
            margin: 0;
        }

        /* Spēļu izkārtojums */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 35px;
            max-width: 1200px;
            width: 100%;
            padding-bottom: 40px;
        }

        /* Spēļu kartītes */
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 1.5px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(26, 29, 50, 0.6);
            border-color: rgba(0, 255, 102, 0.3);
            box-shadow: 0 20px 40px rgba(0, 255, 102, 0.1);
        }

        /* Katrai otrai kartītei iedodam rozā MrBeast akcentu pie hover */
        .game-card:nth-child(even):hover {
            border-color: rgba(255, 0, 127, 0.3);
            box-shadow: 0 20px 40px rgba(255, 0, 127, 0.1);
        }

        /* Bildes/Ikones vieta */
        .game-thumbnail {
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-thumbnail {
            transform: scale(1.05);
        }

        /* Informācija */
        .game-info {
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-info h2 {
            margin: 0 0 20px 0;
            font-size: 1.6rem;
            font-family: 'Impact', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            transition: color 0.3s ease;
        }

        .game-card:hover h2 {
            color: var(--pepe-green);
        }
        .game-card:nth-child(even):hover h2 {
            color: var(--beast-pink);
        }

        /* Poga */
        .play-btn {
            margin-top: auto;
            padding: 14px 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .game-card:hover .play-btn {
            background: linear-gradient(135deg, var(--pepe-green), #00cc52);
            color: #000;
            border-color: var(--pepe-green);
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.2);
        }

        .game-card:nth-child(even):hover .play-btn {
            background: linear-gradient(135deg, var(--beast-pink), #e60072);
            color: #fff;
            border-color: var(--beast-pink);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.2);
        }

        /* Adaptivitāte telefoniem */
        @media (max-width: 680px) {
            h1 { font-size: 3rem; }
            p.subtitle { font-size: 0.9rem; letter-spacing: 2px; }
            .games-grid { grid-template-columns: 1fr; gap: 20px; }
            .game-thumbnail { height: 160px; font-size: 4rem; }
            body { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button id="btn-lv" class="lang-btn" onclick="changeLanguage('lv', event)">LV</button>
        <button id="btn-en" class="lang-btn active" onclick="changeLanguage('en', event)">EN</button>
        <button id="btn-ru" class="lang-btn" onclick="changeLanguage('ru', event)">RU</button>
    </div>

    <header>
        <h1 id="main-title">Pepe vs MrBeast</h1>
        <p id="main-subtitle" class="subtitle">All games in one place</p>
    </header>

    <div class="games-grid">
        <a href="https://pepe-army-vs-mr-beast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🪖</div>
            <div class="game-info">
                <h2 id="g1-title">Pepe Army vs Mr Beast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">⚔️</div>
            <div class="game-info">
                <h2 id="g2-title">Pepe vs MrBeast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast-2.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🏃‍♂️</div>
            <div class="game-info">
                <h2 id="g3-title">Pepe Platformer</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://flappy-pepe-beast-escape.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🐦</div>
            <div class="game-info">
                <h2 id="g4-title">Flappy Pepe Beast Escape</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-memory.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🧠</div>
            <div class="game-info">
                <h2 id="g5-title">Pepe Memory</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
    </div>

    <script>
        const translations = {
            lv: {
                title: "Pepe vs MrBeast", subtitle: "Visas spēles vienuviet", play: "Spēlēt",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            },
            en: {
                title: "Pepe vs MrBeast", subtitle: "All games in one place", play: "Play",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            },
            ru: {
                title: "Pepe vs MrBeast", subtitle: "Все игры в одном месте", play: "Играть",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            }
        };

        function changeLanguage(lang, event) {
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('g1-title').innerText = translations[lang].g1_title;
            document.getElementById('g2-title').innerText = translations[lang].g2_title;
            document.getElementById('g3-title').innerText = translations[lang].g3_title;
            document.getElementById('g4-title').innerText = translations[lang].g4_title;
            document.getElementById('g5-title').innerText = translations[lang].g5_title;

            const playButtons = document.querySelectorAll('.class-play-btn');
            playButtons.forEach(btn => { btn.innerText = translations[lang].play; });

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (event) event.target.classList.add('active');
            else document.getElementById('btn-' + lang).classList.add('active');
        }

        window.onload = function() {
            changeLanguage('en');
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
