<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe vs MrBeast — Gaming Hub</title>
    <style>
        :root {
            --pepe-green: #00ff66;
            --beast-pink: #ff007f;
            --bg-main: #06070b;
            --bg-card: rgba(13, 15, 26, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --text-muted: #8e92a4;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 127, 0.03) 0%, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Valodas slēdzis */
        .lang-switcher {
            align-self: flex-end;
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 60px;
        }

        .lang-btn {
            font-family: var(--font-sans);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .lang-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .lang-btn.active {
            background: #fff;
            color: var(--bg-main);
            border-color: #fff;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        /* Galvene */
        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* Spēļu izkārtojums */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 60px;
        }

        /* Spēļu kartītes */
        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* NEW Tags */
        .new-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--pepe-green);
            color: #000;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            z-index: 10;
        }

        /* Bildes/Ikones vieta */
        .game-thumbnail {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-bottom: 1px solid var(--border-subtle);
            transition: transform 0.3s ease;
        }

        /* Informācija */
        .game-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-info h2 {
            margin-bottom: 20px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }

        /* Poga */
        .play-btn {
            margin-top: auto;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .game-card:hover .play-btn {
            background: #fff;
            color: var(--bg-main);
            border-color: #fff;
        }

        /* Footer */
        footer {
            margin-top: auto;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Adaptivitāte telefoniem */
        @media (max-width: 680px) {
            h1 { font-size: 2.5rem; }
            p.subtitle { font-size: 0.85rem; }
            .games-grid { grid-template-columns: 1fr; gap: 20px; }
            body { padding: 24px 16px; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button id="btn-lv" class="lang-btn" onclick="changeLanguage('lv', event)">LV</button>
        <button id="btn-en" class="lang-btn active" onclick="changeLanguage('en', event)">EN</button>
        <button id="btn-ru" class="lang-btn" onclick="changeLanguage('ru', event)">RU</button>
    </div>

    <header>
        <h1 id="main-title">Pepe vs MrBeast</h1>
        <p id="main-subtitle" class="subtitle">All games in one place</p>
    </header>

    <div class="games-grid">
        <a href="https://pepe-army-vs-mr-beast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🪖</div>
            <div class="game-info">
                <h2 id="g1-title">Pepe Army vs Mr Beast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">⚔️</div>
            <div class="game-info">
                <h2 id="g2-title">Pepe vs MrBeast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast-2.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🏃‍♂️</div>
            <div class="game-info">
                <h2 id="g3-title">Pepe Platformer</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://flappy-pepe-beast-escape.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🐦</div>
            <div class="game-info">
                <h2 id="g4-title">Flappy Pepe Beast Escape</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-memory.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🧠</div>
            <div class="game-info">
                <h2 id="g5-title">Pepe Memory</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-dash-livid.vercel.app/" target="_blank" class="game-card">
            <div class="new-tag">New</div>
            <div class="game-thumbnail">💨</div>
            <div class="game-info">
                <h2 id="g6-title">Pepe Dash</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
    </div>

    <footer>
        <p>&copy; 2026 Pepe vs MrBeast Gaming Hub. All rights reserved.</p>
    </footer>

    <script>
        const translations = {
            lv: {
                title: "Pepe vs MrBeast", subtitle: "Visas spēles vienuviet", play: "Spēlēt",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", 
                g5_title: "Pepe Memory", g6_title: "Pepe Dash"
            },
            en: {
                title: "Pepe vs MrBeast", subtitle: "All games in one place", play: "Play",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", 
                g5_title: "Pepe Memory", g6_title: "Pepe Dash"
            },
            ru: {
                title: "Pepe vs MrBeast", subtitle: "Все игры в одном месте", play: "Играть",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", 
                g5_title: "Pepe Memory", g6_title: "Pepe Dash"
            }
        };

        function changeLanguage(lang, event) {
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('g1-title').innerText = translations[lang].g1_title;
            document.getElementById('g2-title').innerText = translations[lang].g2_title;
            document.getElementById('g3-title').innerText = translations[lang].g3_title;
            document.getElementById('g4-title').innerText = translations[lang].g4_title;
            document.getElementById('g5-title').innerText = translations[lang].g5_title;
            document.getElementById('g6-title').innerText = translations[lang].g6_title;

            const playButtons = document.querySelectorAll('.class-play-btn');
            playButtons.forEach(btn => { btn.innerText = translations[lang].play; });

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (event) event.target.classList.add('active');
            else document.getElementById('btn-' + lang).classList.add('active');
        }

        window.onload = function() {
            changeLanguage('en');
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
