<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe vs MrBeast - Gaming Hub</title>
    <style>
        body {
            font-family: 'Impact', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #14151f 0%, #07080c 100%);
            color: #eeeeee;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .lang-switcher {
            align-self: flex-end;
            margin-bottom: 30px;
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .lang-btn {
            background: rgba(22, 22, 26, 0.7);
            border: 2px solid #2a2a30;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #00ff66;
            color: #000;
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 66, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00ff66, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-family: 'Segoe UI', sans-serif;
            color: #8a8d9b;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .game-card {
            background: rgba(20, 20, 27, 0.65);
            border: 2px solid #1f202e;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ff66;
        }

        .game-thumbnail {
            width: 100%;
            height: 180px;
            background: #13141f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            border-bottom: 2px solid #1f202e;
        }

        .game-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            font-family: 'Segoe UI', sans-serif;
        }

        .game-info h2 {
            margin: 0 0 12px 0;
            font-size: 1.5rem;
            font-family: 'Impact', sans-serif;
            text-transform: uppercase;
        }

        .play-btn {
            margin-top: auto;
            padding: 12px 0;
            margin-top: 20px;
            background: #1a1b26;
            border: 1px solid #2a2b3d;
            border-radius: 8px;
            color: #00ff66;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .game-thumbnail { height: 110px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button id="btn-lv" class="lang-btn" onclick="changeLanguage('lv', event)">LV</button>
        <button id="btn-en" class="lang-btn active" onclick="changeLanguage('en', event)">EN</button>
        <button id="btn-ru" class="lang-btn" onclick="changeLanguage('ru', event)">RU</button>
    </div>

    <header>
        <h1 id="main-title">Pepe vs MrBeast</h1>
        <p id="main-subtitle" class="subtitle">All games in one place</p>
    </header>

    <div class="games-grid">
        <a href="https://pepe-army-vs-mr-beast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🪖</div>
            <div class="game-info">
                <h2 id="g1-title">Pepe Army vs Mr Beast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">⚔️</div>
            <div class="game-info">
                <h2 id="g2-title">Pepe vs MrBeast</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-vs-mrbeast-2.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🏃‍♂️</div>
            <div class="game-info">
                <h2 id="g3-title">Pepe Platformer</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://flappy-pepe-beast-escape.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🐦</div>
            <div class="game-info">
                <h2 id="g4-title">Flappy Pepe Beast Escape</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
        <a href="https://pepe-memory.vercel.app/" target="_blank" class="game-card">
            <div class="game-thumbnail">🧠</div>
            <div class="game-info">
                <h2 id="g5-title">Pepe Memory</h2>
                <div class="play-btn class-play-btn">Play</div>
            </div>
        </a>
    </div>

    <script>
        const translations = {
            lv: {
                title: "Pepe vs MrBeast", subtitle: "Visas spēles vienuviet", play: "Spēlēt",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            },
            en: {
                title: "Pepe vs MrBeast", subtitle: "All games in one place", play: "Play",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            },
            ru: {
                title: "Pepe vs MrBeast", subtitle: "Все игры в одном месте", play: "Играть",
                g1_title: "Pepe Army vs Mr Beast", g2_title: "Pepe vs MrBeast",
                g3_title: "Pepe Platformer", g4_title: "Flappy Pepe Beast Escape", g5_title: "Pepe Memory"
            }
        };

        function changeLanguage(lang, event) {
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('g1-title').innerText = translations[lang].g1_title;
            document.getElementById('g2-title').innerText = translations[lang].g2_title;
            document.getElementById('g3-title').innerText = translations[lang].g3_title;
            document.getElementById('g4-title').innerText = translations[lang].g4_title;
            document.getElementById('g5-title').innerText = translations[lang].g5_title;

            const playButtons = document.querySelectorAll('.class-play-btn');
            playButtons.forEach(btn => { btn.innerText = translations[lang].play; });

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (event) event.target.classList.add('active');
            else document.getElementById('btn-' + lang).classList.add('active');
        }

        window.onload = function() {
            changeLanguage('en');
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
