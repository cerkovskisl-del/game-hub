<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kapec Network — Ultimate Gaming Hub</title>
    <style>
        :root {
            --brand1: #ff0055; 
            --brand2: #00f3ff; 
            --bg-base: #050508;
            --glass: rgba(20, 20, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-cyber: 'Inter', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        body {
            font-family: var(--font-cyber);
            background-color: var(--bg-base);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 160px 20px 60px 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 85, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.08), transparent 25%);
        }

        #bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1000px; background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); border-radius: 100px;
            z-index: 100; padding: 12px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; background: linear-gradient(90deg, var(--brand1), var(--brand2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.05) rotate(-2deg); }

        .nav-menu { display: flex; gap: 24px; list-style: none; }
        .nav-item { color: #94a3b8; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .nav-item::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 2px; background: var(--brand2); transition: width 0.3s ease; }
        .nav-item:hover, .nav-item.active { color: #fff; }
        .nav-item.active::after { width: 100%; }

        .nav-right { display: flex; align-items: center; gap: 12px; }
        .support-btn { background: linear-gradient(45deg, var(--brand1), #ff6b6b); color: #fff; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; padding: 10px 20px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3); transition: all 0.3s ease; }
        .support-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 0, 85, 0.5); }

        .lang-mini-switcher { display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 20px; border: 1px solid var(--glass-border); }
        .lang-mini-btn { background: transparent; border: none; color: #64748b; font-size: 0.75rem; font-weight: 800; padding: 6px 10px; border-radius: 15px; cursor: pointer; transition: all 0.3s ease; }
        .lang-mini-btn.active { background: #fff; color: #000; box-shadow: 0 2px 10px rgba(255,255,255,0.2); }

        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; background: linear-gradient(135deg, #fff 30%, var(--brand2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-size: 0.9rem; color: #94a3b8; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; }

        .search-input { width: 100%; max-width: 550px; padding: 16px 24px; font-size: 1rem; color: #fff; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 50px; outline: none; margin-bottom: 50px; text-align: center; transition: all 0.3s ease; backdrop-filter: blur(10px); }
        .search-input:focus { border-color: var(--brand2); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; width: 100%; max-width: 1200px; }
        .game-card { background: linear-gradient(145deg, rgba(30,30,40,0.6), rgba(15,15,20,0.8)); border: 1px solid var(--glass-border); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--brand2); box-shadow: 0 15px 40px rgba(0, 243, 255, 0.2); }

        .new-tag { position: absolute; top: 15px; right: 15px; background: var(--brand1); color: #fff; font-size: 0.7rem; font-weight: 800; padding: 6px 12px; border-radius: 20px; text-transform: uppercase; z-index: 10; box-shadow: 0 0 15px var(--brand1); }
        .game-thumbnail { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 5rem; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); transition: transform 0.4s ease; }
        .game-card:hover .game-thumbnail { transform: scale(1.1); }

        .game-info { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
        .game-info h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: #fff; }

        .card-actions { display: flex; gap: 12px; margin-top: auto; }
        .play-btn { flex-grow: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 14px; color: #fff; text-align: center; font-weight: 700; text-transform: uppercase; text-decoration: none; transition: all 0.3s ease; cursor: pointer;}
        .play-btn:hover { background: var(--brand2); border-color: var(--brand2); color: #000; box-shadow: 0 0 15px rgba(0,243,255,0.4); }

        .share-btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; color: #fff; }
        .share-btn:hover { background: #fff; color: #000; transform: rotate(15deg); }

        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--brand2); color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 800; z-index: 1000; transition: bottom 0.4s ease; box-shadow: 0 10px 30px rgba(0,243,255,0.4); display: flex; align-items: center; gap: 8px; }
        .toast.show { bottom: 40px; }
        footer { margin-top: 60px; text-align: center; padding-top: 40px; border-top: 1px solid var(--glass-border); width: 100%; color: #64748b; font-size: 0.85rem; }
        .footer-support { color: #fff; text-decoration: none; font-weight: 700; border-bottom: 1px dashed rgba(255,255,255,0.3); margin-top: 8px; display: inline-block; transition: color 0.2s ease;}
        .footer-support:hover { color: var(--brand2); }

        @media (max-width: 768px) {
            .navbar { width: 90%; padding: 10px 15px; border-radius: 20px; }
            .nav-menu { display: none; }
            h1 { font-size: 2.5rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .game-thumbnail { height: 120px; font-size: 3.5rem; }
            .game-info { padding: 15px; }
            .game-info h2 { font-size: 1rem; }
            .play-btn { font-size: 0.8rem; padding: 10px; }
            .share-btn { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>
    <canvas id="bg-particles"></canvas>

    <nav class="navbar">
        <div class="logo" onclick="filterCategory('all')">KapecHub</div>
        <ul class="nav-menu">
            <li><a class="nav-item active" id="m-all" onclick="filterCategory('all')">All Games</a></li>
            <li><a class="nav-item" id="m-new" onclick="filterCategory('new')">New</a></li>
            <li><a class="nav-item" id="m-pop" onclick="filterCategory('popular')">Popular</a></li>
            <li><a class="nav-item" id="m-sim" onclick="filterCategory('simulations')">Simulations</a></li>
        </ul>
        <div class="nav-right">
            <a href="https://revolut.me/igorsyeqd" target="_blank" id="nav-support" class="support-btn">Support</a>
            <div class="lang-mini-switcher">
                <button id="mlang-lv" class="lang-mini-btn" onclick="changeLanguage('lv')">LV</button>
                <button id="mlang-en" class="lang-mini-btn active" onclick="changeLanguage('en')">EN</button>
                <button id="mlang-ru" class="lang-mini-btn" onclick="changeLanguage('ru')">RU</button>
            </div>
        </div>
    </nav>

    <header>
        <h1 id="main-title">Kāpēc</h1>
        <p id="main-subtitle" class="subtitle">All games in one place</p>
    </header>

    <input type="text" id="search-bar" class="search-input" placeholder="Search games..." oninput="filterGames()">

    <!-- Spēles ģenerēsies šeit -->
    <div class="games-grid" id="games-grid"></div>

    <div id="toast-msg" class="toast"><span>✅</span> <span id="toast-text">Category updated!</span></div>

    <footer>
        <p>&copy; 2026 Kapec Gaming Hub Network.</p>
        <a href="https://revolut.me/igorsyeqd" target="_blank" id="footer-support-link" class="footer-support">Support Developer</a>
    </footer>

    <script>
        // SPĒĻU DATUBĀZE (Pievieno jaunas spēles šeit)
        const gamesData = [
            { id: 'g12', emoji: '🪐', url: 'https://pepetopia-rust.vercel.app', new: true, pop: true, sim: true },
            { id: 'g1', emoji: '🏰', url: 'https://pepe-vs-mrbeast-tower-defense.vercel.app/', new: true, pop: true, sim: false },
            { id: 'g2', emoji: '🪖', url: 'https://pepe-army-vs-mr-beast.vercel.app/', new: false, pop: true, sim: false },
            { id: 'g3', emoji: '⚔️', url: 'https://pepe-vs-mrbeast.vercel.app/', new: false, pop: false, sim: false },
            { id: 'g4', emoji: '🏃‍♂️', url: 'https://pepe-vs-mrbeast-2.vercel.app/', new: false, pop: false, sim: false },
            { id: 'g5', emoji: '🐦', url: 'https://flappy-pepe-beast-escape.vercel.app/', new: false, pop: false, sim: false },
            { id: 'g6', emoji: '🧠', url: 'https://pepe-memory.vercel.app/', new: false, pop: false, sim: false },
            { id: 'g7', emoji: '💎', url: 'https://pepe-dash-livid.vercel.app/', new: false, pop: false, sim: false },
            { id: 'g8', emoji: '🔫', url: 'https://cs-go-3.onrender.com/', new: true, pop: false, sim: false },
            { id: 'g9', emoji: '🔮', url: 'https://marble-race-peach.vercel.app/', new: true, pop: false, sim: true },
            { id: 'g10', emoji: '⚽', url: 'https://physics-ball-simulation-five.vercel.app/', new: true, pop: false, sim: true },
            { id: 'g11', emoji: '🌍', url: 'https://country-ball-elimination-game.vercel.app/', new: true, pop: true, sim: true }
        ];

        const translations = {
            lv: { title: "Kāpēc", subtitle: "Visas spēles vienuviet", play: "Spēlēt", search: "Meklēt spēli...", m_all: "Visas Spēles", m_new: "Jaunumi", m_pop: "Populāras", m_sim: "Simulācijas", toast: "Kategorija atjaunināta!", support: "Atbalstīt", footer_support: "Atbalstīt izstrādātāju", copied: "Saite kopēta!", g1_title: "Kapec Tower Defense", g2_title: "Kapec Army", g3_title: "Kapec Arena", g4_title: "Kapec Platformer", g5_title: "Flappy Kapec", g6_title: "Kapec Memory", g7_title: "Kapec Dash", g8_title: "Clicker Kapec", g9_title: "Marmora bumbiņu sacīkstes", g10_title: "Fizikas bumbas simulācija", g11_title: "Valstu bumbu izslēgšanas spēle", g12_title: "Kapectopia" },
            en: { title: "Kapec", subtitle: "All games in one place", play: "Play", search: "Search games...", m_all: "All Games", m_new: "New", m_pop: "Popular", m_sim: "Simulations", toast: "Category updated!", support: "Support", footer_support: "Support Developer", copied: "Link copied!", g1_title: "Kapec Tower Defense", g2_title: "Kapec Army", g3_title: "Kapec Arena", g4_title: "Kapec Platformer", g5_title: "Flappy Kapec", g6_title: "Kapec Memory", g7_title: "Kapec Dash", g8_title: "Clicker Kapec", g9_title: "Marble Race Simulation", g10_title: "Physics Ball Simulation", g11_title: "Country Ball Elimination", g12_title: "Kapectopia" },
            ru: { title: "Kapec", subtitle: "Все игры в одном месте", play: "Играть", search: "Поиск игры...", m_all: "Все игры", m_new: "Новинки", m_pop: "Популярные", m_sim: "Симуляции", toast: "Категория обновлена!", support: "Поддержать", footer_support: "Поддержать разработчика", copied: "Ссылка скопирована!", g1_title: "Kapec Tower Defense", g2_title: "Kapec Army", g3_title: "Kapec Arena", g4_title: "Kapec Platformer", g5_title: "Flappy Kapec", g6_title: "Kapec Memory", g7_title: "Kapec Dash", g8_title: "Clicker Kapec", g9_title: "Симулятор гонок", g10_title: "Симуляция мяча", g11_title: "Игра на выбывание", g12_title: "Капектопия" }
        };

        let currentLang = 'en';
        let currentCategory = 'all';
        let toastTimeout;

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = ''; // Notīra vecos datus

            gamesData.forEach(game => {
                const title = translations[currentLang][`${game.id}_title`];
                const playTxt = translations[currentLang].play;
                const newTag = game.new ? `<div class="new-tag">New</div>` : '';
                
                const card = document.createElement('div');
                card.className = 'game-card';
                if (game.new) card.dataset.new = "true";
                if (game.pop) card.dataset.pop = "true";
                if (game.sim) card.dataset.sim = "true";
                card.dataset.title = title.toLowerCase();

                card.innerHTML = `
                    ${newTag}
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <h2>${title}</h2>
                        <div class="card-actions">
                            <a href="${game.url}" target="_blank" class="play-btn">${playTxt}</a>
                            <div class="share-btn" onclick="copyLink('${game.url}', event)" title="Share">🔗</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            filterGames();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('main-title').innerText = t.title;
            document.getElementById('main-subtitle').innerText = t.subtitle;
            document.getElementById('search-bar').placeholder = t.search;
            document.getElementById('m-all').innerText = t.m_all;
            document.getElementById('m-new').innerText = t.m_new;
            document.getElementById('m-pop').innerText = t.m_pop;
            document.getElementById('m-sim').innerText = t.m_sim;
            document.getElementById('nav-support').innerText = t.support;
            document.getElementById('footer-support-link').innerText = t.footer_support;

            document.querySelectorAll('.lang-mini-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('mlang-' + lang).classList.add('active');

            renderGames(); // Pārzīmē visas kartītes jaunajā valodā
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            const mapping = { 'all': 'm-all', 'new': 'm-new', 'popular': 'm-pop', 'simulations': 'm-sim' };
            document.getElementById(mapping[category]).classList.add('active');
            
            showToast(translations[currentLang].toast);
            filterGames();
        }

        function filterGames() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.game-card');

            cards.forEach(card => {
                const titleText = card.dataset.title;
                const matchesSearch = titleText.includes(query);
                let matchesCategory = true;

                if (currentCategory === 'new' && !card.dataset.new) matchesCategory = false;
                if (currentCategory === 'popular' && !card.dataset.pop) matchesCategory = false;
                if (currentCategory === 'simulations' && !card.dataset.sim) matchesCategory = false;

                card.style.display = (matchesSearch && matchesCategory) ? 'flex' : 'none';
            });
        }

        function copyLink(link, event) {
            event.preventDefault();
            navigator.clipboard.writeText(link).then(() => {
                showToast(translations[currentLang].copied);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            const toastText = document.getElementById('toast-text');
            clearTimeout(toastTimeout);
            toastText.innerText = msg;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Fona daļiņas (Particles)
        const canvas = document.getElementById('bg-particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * 0.2 - 0.1;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(40, Math.floor(window.innerWidth / 25));
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.onload = () => changeLanguage('en');
    </script>
</body>
</html>
